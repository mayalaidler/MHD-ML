[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ionpred"
version = "0.1.0"
description = "Predict ion abundances in FLASH MHD simulations from local gas properties with ML"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maya Laidler" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "h5py>=3.8",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
nn = ["torch>=2.0"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[project.scripts]
ionpred = "ionpred.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
